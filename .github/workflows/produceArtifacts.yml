name: Builds app on all targets + upload to github pages + upload to artifacts microservice

on:
  workflow_dispatch:
  push:


permissions:
  contents: write

jobs:
  basicTest:
    runs-on: ubuntu-latest
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      repository_name: NineMensMorris
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run basic tests with Gradle
        run: ./gradlew testReleaseUnitTest

  uiTest:
    strategy:
      matrix:
        include:
          # android
          - target: allDevicesDebugAndroidTest -x test -x iosSimulatorArm64Test -x desktopTest -x wasmJsTest
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            os: ubuntu-latest

          # ios
          - target: iosSimulatorArm64Test -x test -x connectedAndroidTest -x desktopTest -x wasmJsTest
            before: |
            os: macos-13

#          # web
#          - target: wasmJsBrowserTest -x test -x iosSimulatorArm64Test -x connectedAndroidTest -x desktopTest -x wasmJsTest
#            before: |
#            os: ubuntu-latest

          # desktop
          - target: desktopTest -x test -x test -x iosSimulatorArm64Test -x connectedAndroidTest -x wasmJsTest
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute before action
        run: ${{ matrix.before }}

      - name: Run tests
        run: ./gradlew ${{ matrix.target }}

  produceArtifacts:
    needs: [ basicTest, uiTest ]
    strategy:
      matrix:
        include:
          # android
          - target: assembleRelease
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            tag: Android
            directory: composeApp/build/outputs/apk/release/composeApp-release.apk
            os: ubuntu-latest
          # macos
          - target: packageReleaseDmg
            before: |
            tag: MacosDmg
            directory: composeApp/build/compose/binaries/main-release/dmg/
            os: macos-13
          # ios
          - target: iosSimulatorArm64Binaries
            before: |
            tag: Ios
            directory: composeApp/build/libs/composeApp-desktop.jar
            os: macos-latest
          # web
          - target: wasmJsBrowserDistribution
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            tag: Web
            directory: composeApp/build/dist/wasmJs/productionExecutable/
            os: ubuntu-latest
          # jar
          - target: packageReleaseUberJarForCurrentOS
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            tag: Jar
            directory: composeApp/build/compose/jars/
            os: ubuntu-latest
          # linux rpm
          - target: packageReleaseRpm
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            tag: LinuxRpm
            directory: composeApp/build/compose/binaries/main-release/rpm/
            os: ubuntu-latest
          # linux deb
          - target: packageReleaseDeb
            before: |
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
              sudo udevadm control --reload-rules
              sudo udevadm trigger --name-match=kvm
            tag: LinuxDeb
            directory: composeApp/build/compose/binaries/main-release/deb/
            os: ubuntu-latest
          # windows
          - target: packageReleaseExe
            before: |
            tag: WindowsExe
            directory: composeApp/build/compose/binaries/main-release/exe/
            os: windows-latest
    runs-on: ${{ matrix.os }}

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      repository_name: NineMensMorris
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute before action
        run: ${{ matrix.before }}

      - name: Produce artifacts
        run: ./gradlew ${{ matrix.target }} -x test -x iosSimulatorArm64Test -x connectedAndroidTest -x desktopTest -x wasmJsTest

      - name: Upload artifacts to github
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.repository_name }}-${{ matrix.tag }}-artifact
          path: ${{ matrix.directory }}

  uploadWebArtifactsToGithubPages:
    needs: [ produceArtifacts ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ../artifacts
      - uses: actions/checkout@v4
        with:
          ref: 'github-pages'
      - name: Upload artifacts to artifacts github pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv LICENSE ../
          rm -rf *
          cp -r ../artifacts/NineMensMorris-Web-artifact/* .
          mv ../LICENSE .
          ls -hlas
          git config user.name "GitHub Actions Bot"
          git config user.email "123553746+kroune@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit . -m "update web artifacts"
          git push

  uploadArtifactsToMicroservice:
    needs: [ produceArtifacts ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Upload artifacts to artifacts microservice
        run: |
          ls -hlas
          for FILE in *; do
            PLATFORM_NAME=$(echo $FILE | cut -d "-" -f 2)
            echo "Compressing file for $PLATFORM_NAME, file - $FILE"
            7z a -mx=9 ../$FILE.7z $FILE
            curl -v --connect-timeout 30 -m 300 -X POST -T ../$FILE.7z https://nine-men-s-morris.me/artifacts-service/upload?auth_token=${{ secrets.AUTH_TOKEN }}\&type=Testing\&platform=$PLATFORM_NAME\&commit=${{ github.event.head_commit.id }}\&branch=${{ github.ref_name }}
          done
